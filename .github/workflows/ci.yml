name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore TaskFlow.slnx
      - name: Restore EF Core tool
        run: dotnet tool restore
      - name: Build with .NET analyzers
        run: dotnet build TaskFlow.slnx --configuration Release --no-restore
      - name: Verify analyzer errors
        run: dotnet format analyzers TaskFlow.slnx --verify-no-changes --no-restore --severity error
      - name: Unit and PostgreSQL integration tests
        run: dotnet test TaskFlow.slnx --configuration Release --no-build --logger trx --results-directory artifacts/test-results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: backend-test-results
          path: artifacts/test-results
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  compose:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Generate isolated local secrets
        run: node scripts/setup.mjs
      - name: Build image, migrate and start application
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Smoke test the composed application
        run: node scripts/smoke.mjs
      - name: Install browser tests
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser tests against the composed application
        env:
          TASKFLOW_BASE_URL: http://localhost:8080
          E2E_BASE_URL: http://localhost:8080
        run: node scripts/e2e.mjs
      - name: Capture Compose logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color > artifacts/compose.log
      - name: Upload browser reports and logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: compose-and-browser-results
          path: |
            artifacts/compose.log
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop containers
        if: always()
        run: docker compose down
